<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">BAR – ATH <span>match viewer</span></div>
    <div class="transport">
      <button id="play" class="primary" title="Space">Play</button>
      <button data-step="-250" title="Alt + ←">−10 s</button>
      <button data-step="-25" title="Shift + ←">−1 s</button>
      <button data-step="-1" title="←">−1 f</button>
      <button data-step="1" title="→">+1 f</button>
      <button data-step="25" title="Shift + →">+1 s</button>
      <button data-step="250" title="Alt + →">+10 s</button>
      <select id="rate" title="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <form id="jump-form"><input id="jump" placeholder="frame, or 1h 12:30" title="J" autocomplete="off"></form>
    </div>
    <div class="clock" id="clock">loading…</div>
  </header>

  <main class="stage">
    <section class="video-wrap">
      <video id="video" src="/video.mp4" preload="auto" muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="badge" id="ball-badge" hidden>ball not tracked</div>
    </section>
    <aside class="side">
      <canvas id="pitch"></canvas>
      <div class="layers">
        <label><input type="checkbox" id="l-players" checked> players on video</label>
        <label><input type="checkbox" id="l-ball" checked> ball on video</label>
        <label><input type="checkbox" id="l-numbers"> slot numbers</label>
        <label><input type="checkbox" id="l-sound"> sound</label>
      </div>
      <div class="info" id="info"></div>
    </aside>
  </main>

  <section class="timelines">
    <div class="tl-head"><span>Whole match</span><span class="hint">click to jump · grey bands are not graded</span></div>
    <canvas id="overview"></canvas>
    <div class="tl-head">
      <span>Detail <b id="zoom-label">±30 s</b></span>
      <span class="hint"><button id="zoom-in" title="[">zoom in</button><button id="zoom-out" title="]">zoom out</button></span>
    </div>
    <canvas id="detail"></canvas>
  </section>

  <footer class="keys">
    <span><kbd>Space</kbd> play</span>
    <span><kbd>←</kbd><kbd>→</kbd> 1 frame</span>
    <span><kbd>Shift</kbd> 1 s</span>
    <span><kbd>Alt</kbd> 10 s</span>
    <span><kbd>[</kbd><kbd>]</kbd> zoom</span>
    <span><kbd>N</kbd><kbd>P</kbd> next / previous v1 change</span>
    <span><kbd>J</kbd> jump</span>
  </footer>

  <div class="loading" id="loading">Loading match data…</div>
  <script src="app.js"></script>
</body>
</html>
